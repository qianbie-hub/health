services:
  # ---------------------------------------------
  # PostgreSQL Relational Database Service
  # ---------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: vigil_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigil_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigil_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vigil_db}
    ports:
      - "5432:5432"
    volumes:
      - vigil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigil_user} -d ${POSTGRES_DB:-vigil_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigil_net

  # ---------------------------------------------
  # FastAPI REST & SSE Streaming Backend Service
  # ---------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigil_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vigil_user}:${POSTGRES_PASSWORD:-vigil_secure_password_2026}@db:5432/${POSTGRES_DB:-vigil_db}
      SECRET_KEY: ${SECRET_KEY:-vigil_production_ultra_secret_key_892348923478923}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1,http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-Vigil Health Security <no-reply@vigilhealth.ai>}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-10}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - vigil_net

  # ---------------------------------------------
  # React 19 Frontend with Nginx Web Server
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vigil_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - vigil_net

volumes:
  vigil_postgres_data:
    driver: local

networks:
  vigil_net:
    driver: bridge
